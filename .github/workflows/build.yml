name: Build & Release (noweb)

# Tracks upstream ente-io/ente and rebuilds Photos + Auth APKs whenever
# upstream cuts a new release tag for either app. Both apps live in the
# same monorepo but have independent release streams:
#   Photos tags: photos-v1.2.3   APK: ente-photos-v1.2.3.apk
#   Auth tags:   auth-v4.5.6     APK: ente-auth-v4.5.6.apk
#
# Branch layout in this fork:
#   main   - synced to upstream tags as they're processed (no manual edits)
#   noweb  - contains exactly these commits on top of main:
#              1. patch: apps/auth/lib/utils/platform_util.dart
#              2. patch: apps/photos/lib/ui/common/web_page.dart
#              3. ci:    add .github/workflows/build.yml (this file)
#            CI rebases noweb onto whichever upstream tag is being built
#            and force-pushes. Patches are tiny and target stable leaf
#            files, so rebase conflicts should be rare.
#
# Note: flutter_inappwebview is intentionally KEPT in apps/photos/pubspec.yaml
# because payment_web_page.dart (Stripe checkout) still uses it. Payment is a
# legitimate flow, not general browsing.

on:
  schedule:
    - cron: '0 6 * * *' # daily 06:00 UTC
  workflow_dispatch:
    inputs:
      force:
        description: 'Force rebuild even if release exists'
        required: false
        default: 'false'

# Cancel any superseded run; never run two builds concurrently (they fight
# over the main/noweb branches).
concurrency:
  group: noweb-build
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout noweb branch
        uses: actions/checkout@v4
        with:
          ref: noweb
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Add upstream remote
        run: |
          git remote add upstream https://github.com/ente-io/ente.git
          git fetch upstream --tags --no-recurse-submodules

      # ------------------------------------------------------------------
      # Resolve latest tag per app
      # ------------------------------------------------------------------
      - name: Resolve latest upstream tags
        id: tags
        run: |
          set -euo pipefail
          PHOTOS=$(git tag -l 'photos-v*' --sort=-v:refname | head -1 || true)
          AUTH=$(git tag -l 'auth-v*'   --sort=-v:refname | head -1 || true)
          echo "Photos tag: ${PHOTOS:-none}"
          echo "Auth tag:   ${AUTH:-none}"
          echo "photos=${PHOTOS}" >> $GITHUB_OUTPUT
          echo "auth=${AUTH}"     >> $GITHUB_OUTPUT

      # ------------------------------------------------------------------
      # Toolchain (set up once; reused for both builds).
      # Versions mirror upstream's .github/actions/setup-flutter (3.38.10)
      # and photos-build.yml / auth-build.yml (JDK 17).
      # ------------------------------------------------------------------
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter 3.38.10 (uses upstream's composite action)
        uses: ./.github/actions/setup-flutter

      - name: Flutter doctor
        run: flutter doctor

      - name: Set up Rust toolchain (for Photos codegen)
        uses: dtolnay/rust-toolchain@stable

      - name: Restore signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 secret not set."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > ${{ runner.temp }}/noweb.keystore

      # ==================================================================
      # PHOTOS BUILD (only if not already released)
      # ==================================================================
      - name: Check if Photos needs building
        id: photos_skip
        if: github.event.inputs.force != 'true'
        env:
          TAG: ${{ steps.tags.outputs.photos }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -z "$TAG" ]; then
            echo "skip=true"  >> $GITHUB_OUTPUT
            exit 0
          fi
          if gh release view "$TAG-noweb" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Photos $TAG-noweb already released; skipping."
            echo "skip=true"  >> $GITHUB_OUTPUT
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      - name: Build Photos
        if: steps.photos_skip.outputs.skip != 'true'
        env:
          PHOTOS_TAG: ${{ steps.tags.outputs.photos }}
          SIGNING_KEY_PATH: ${{ runner.temp }}/noweb.keystore
          SIGNING_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          SIGNING_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # Sync main to the photos tag, rebase noweb, push
          git checkout main
          git reset --hard upstream/"$PHOTOS_TAG"
          git push -f origin main
          git checkout noweb
          git rebase main
          git push -f origin noweb

          # Pub get + Rust codegen (Photos uses flutter_rust_bridge bindings)
          (cd mobile/apps/photos && flutter pub get --enforce-lockfile)
          (cd rust && cargo codegen frb)

          # Build the Photos APK (mirrors upstream's photos-build.yml step)
          (cd mobile/apps/photos && flutter build apk \
            --release \
            --flavor independent \
            --target-platform android-arm,android-arm64 \
            --dart-define=cronetHttpNoPlay=true)

          # Stage + release
          mkdir -p artifacts
          cp mobile/apps/photos/build/app/outputs/flutter-apk/app-independent-release.apk \
             "artifacts/ente-photos-${PHOTOS_TAG}.apk"
          ls -la artifacts/

          gh release create "$PHOTOS_TAG-noweb" \
            --title "Ente Photos ${PHOTOS_TAG} (noweb)" \
            --notes "Auto-build of upstream ${PHOTOS_TAG} with in-app webview disabled. Links open in (the now-removed) external browser and silently fail." \
            --target noweb \
            artifacts/ente-photos-${PHOTOS_TAG}.apk

      # ==================================================================
      # AUTH BUILD (only if not already released)
      # ==================================================================
      - name: Check if Auth needs building
        id: auth_skip
        if: github.event.inputs.force != 'true'
        env:
          TAG: ${{ steps.tags.outputs.auth }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -z "$TAG" ]; then
            echo "skip=true"  >> $GITHUB_OUTPUT
            exit 0
          fi
          if gh release view "$TAG-noweb" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Auth $TAG-noweb already released; skipping."
            echo "skip=true"  >> $GITHUB_OUTPUT
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      - name: Build Auth
        if: steps.auth_skip.outputs.skip != 'true'
        env:
          AUTH_TAG: ${{ steps.tags.outputs.auth }}
          SIGNING_KEY_PATH: ${{ runner.temp }}/noweb.keystore
          SIGNING_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          SIGNING_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # Sync main to the auth tag, rebase noweb, push
          git checkout main
          git reset --hard upstream/"$AUTH_TAG"
          git push -f origin main
          git checkout noweb
          git rebase main
          git push -f origin noweb

          # Auth does not run Rust codegen (bindings are pre-generated)
          (cd mobile/apps/auth && flutter pub get --enforce-lockfile)

          # Build the Auth APK (mirrors upstream's auth-build.yml step,
          # minus the --build-name/--build-number overrides which read
          # from pubspec.yaml at the tagged commit instead)
          (cd mobile/apps/auth && flutter build apk \
            --release \
            --flavor independent \
            --dart-define=cronetHttpNoPlay=true)

          mkdir -p artifacts
          cp mobile/apps/auth/build/app/outputs/flutter-apk/app-independent-release.apk \
             "artifacts/ente-auth-${AUTH_TAG}.apk"
          ls -la artifacts/

          gh release create "$AUTH_TAG-noweb" \
            --title "Ente Auth ${AUTH_TAG} (noweb)" \
            --notes "Auto-build of upstream ${AUTH_TAG} with in-app webview disabled. Links open in (the now-removed) external browser and silently fail." \
            --target noweb \
            artifacts/ente-auth-${AUTH_TAG}.apk
